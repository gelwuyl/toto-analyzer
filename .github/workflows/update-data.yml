name: Refresh TOTO data

# Keeps the hosted database growing. Runs 3x/day off the hour, plus manual.
# Commits any new draws -> triggers the deploy workflow.
on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate CSV + JSON
        run: python parse_toto.py --out public

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/toto_official.csv public/toto_official.json
          git diff --cached --quiet || git commit -m "chore: refresh TOTO draws"
          git push
