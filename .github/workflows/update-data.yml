name: Refresh TOTO data

# Keeps the hosted database growing.
# Schedule (Singapore time = UTC+8):
#   - 22:00 SGT every Monday (14:00 UTC)   -> regular draw day
#   - 22:00 SGT every Thursday (14:00 UTC) -> regular draw day
#   - 23:30 SGT every Friday (15:30 UTC)   -> FALLBACK: if a Thursday draw
#       is delayed to Friday (public holidays, CNY, etc.), this run still
#       picks up the new draw so the DB never stalls a week.
# Also runnable manually via workflow_dispatch.
on:
  schedule:
    - cron: '0 14 * * 1'   # Mon 22:00 SGT
    - cron: '0 14 * * 4'   # Thu 22:00 SGT
    - cron: '30 15 * * 5'  # Fri 23:30 SGT  (fallback for delayed draws)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate CSV + JSON
        run: python parse_toto.py --out public

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/toto_official.csv public/toto_official.json
          git diff --cached --quiet || git commit -m "chore: refresh TOTO draws"
          git push

      # Guard against a stale live deployment: if the committed CSV ever
      # lags what's actually deployed on Pages, force a fresh rebuild so the
      # live site can never serve a build missing the newest draws.
      - name: Force fresh Pages deploy (anti-stale)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              per_page: 1,
            });
            const last = runs.workflow_runs[0];
            if (last && last.status === 'completed') {
              console.log('Re-running Deploy to GitHub Pages (run ' + last.id + ') to refresh the live build.');
              await github.rest.actions.reRunWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: last.id,
              });
            } else {
              console.log('No completed deploy run found; skipping re-run.');
            }
